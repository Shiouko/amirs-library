<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amir's Library</title>
  <meta name="description" content="Amir's personal anime, manga, manhwa and manhua tracking shelf.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Typography: Bebas Neue (display) / Zen Kaku Gothic New (body) / Shippori Mincho (decorative JP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Ambient halftone dot layer, drifts upward (90s loop) -->
  <div class="halftone" aria-hidden="true"></div>

  <!-- Ink-splash transition overlay (clip-path circle from click origin) -->
  <div class="splash" aria-hidden="true"></div>

  <!-- ============ MASTHEAD ============ -->
  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-brand">
        <h1 class="masthead-title"><span class="brand-block" aria-hidden="true"></span>AMIR'S LIBRARY</h1>
        <p class="masthead-sub"><span class="jp">アニメ・漫画・만화</span> — personal reading &amp; watching log</p>
      </div>
      <div class="masthead-meta">
        <span class="caption-strip">LAST UPDATED <span id="last-updated">—</span></span>
        <span class="count-stamp" id="total-stamp">0 TITLES</span>
      </div>
    </div>
    <div class="masthead-rule" aria-hidden="true"></div>
    <div class="masthead-kanji" aria-hidden="true">書庫</div>
  </header>

  <!-- ============ MAIN (router outlet) ============ -->
  <main id="app" class="app">
    <noscript>
      <div class="empty-panel">
        <p class="empty-glyph">空</p>
        <h2 class="empty-title">This shelf needs JavaScript</h2>
        <p class="empty-hint">The library is rendered client-side from <code>data/library.json</code>. Please enable JavaScript to browse.</p>
      </div>
    </noscript>
    <div id="view" class="view">
      <div class="boot-state"><span class="boot-glyph">読</span><span class="boot-text">Opening the shelf…</span></div>
    </div>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <span>AMIR'S LIBRARY — maintained by Liora <span class="footer-heart">♥</span></span>
    <span class="footer-sep" aria-hidden="true">/</span>
    <span>data: <code>library.json</code></span>
    <span class="footer-sep" aria-hidden="true">/</span>
    <span id="footer-year">2026</span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
